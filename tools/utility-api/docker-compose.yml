services:
  utility-api:
    build: .
    container_name: utility-api
    image: utility-api:v0.2.0
    restart: unless-stopped
    networks:
      pfsense-vlan:
        ipv4_address: 172.20.60.51
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.utility-api.rule=Host(`utility-api.idp.labops.uk`)"
      - "traefik.http.routers.utility-api.entrypoints=https"
      - "traefik.http.routers.utility-api.tls=true"
      - "traefik.http.routers.utility-api.tls.certresolver=cloudflare"
      - "traefik.http.services.utility-api.loadbalancer.server.port=8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  pfsense-vlan:
    external: true