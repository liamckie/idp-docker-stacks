version: "3.8"

services:
  hello:
    image: nginxdemos/hello
    container_name: hello-idp-test
    ports:
      - "8088:80"
      - "9000:9000"
    restart: unless-stopped
    networks:
      pfsense-vlan:
        ipv4_address: 172.20.60.41
    deploy:
      restart_policy:
        condition: any
    labels:
      - "com.portainer.stack.deploy=true"

networks:
  pfsense-vlan:
    external: true
