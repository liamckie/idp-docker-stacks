version: "3.8"

services:
  hello:
    image: nginxdemos/hello
    container_name: hello
    # ports:
    #   - "8088:80"
    #   - "9000:9000"
    restart: unless-stopped
    networks:
      pfsense-vlan:
        ipv4_address: 172.20.60.41
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hello.rule=Host(`hello.idp.labops.uk`)"
      - "traefik.http.routers.hello.entrypoints=https"
      - "traefik.http.routers.hello.tls=true"
      - "traefik.http.services.hello.loadbalancer.server.port=80"

networks:
  pfsense-vlan:
    external: true
