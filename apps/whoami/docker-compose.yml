version: "3.8"

services:
  whoami:
    image: traefik/whoami
    container_name: whoami
    # ports:
    #   - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.entrypoints=https"
      - "traefik.http.routers.whoami.rule=Host(`whoami.idp.labops.uk`)"
      - "traefik.http.routers.whoami.middlewares=default-headers,default-whitelist"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"
      
      - "com.portainer.stack.deploy=true"
    restart: unless-stopped