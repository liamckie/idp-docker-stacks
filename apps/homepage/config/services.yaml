---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/

- Services:
    - Treafik:
        href: https://traefik.idp.labops.uk/dashboard/#/
        description: Dev Traefik Dashboard
        icon: traefik-icon.png

    - Grafana:
        href: https://grafana.idp.labops.uk/d/000000001/prometheus-overview?orgId=1&refresh=5s
        description: Dev Grafana Dashboard
        icon: grafana-icon.png

    - Portainer:
        href: https://portainer.idp.labops.uk/
        description: Dev Portainer Dashboard
        icon: portainer-icon.png  

    - Utility API:
        href: https://utility-api.idp.labops.uk/docs
        description: IDP reference workload
        widget:
          type: customapi
          url: https://utility-api.idp.labops.uk/homepage/summary
          refreshInterval: 10000
          mappings:
            - field: containers_running
              label: Running
              format: number

            - field: containers_unhealthy
              label: Unhealthy
              format: number

            - field: alerts_firing
              label: Alerts
              format: number                  
